name: referral_kit
description: >-
  Invite-friends referral flow for Flutter apps on Supabase and RevenueCat: invite screen, code entry, offline
  claim queue and an install id that survives reinstall.
version: 0.6.0
# Not on pub.dev for now (pub.dev has 0.5.0): use it as a git dependency on this repository (tag referral_kit-v0.6.0).
publish_to: none
homepage: https://www.myind.ai/referral-kit
repository: https://github.com/shaantanu9/referral-rewards-kit
issue_tracker: https://github.com/shaantanu9/referral-rewards-kit/issues
documentation: https://github.com/shaantanu9/referral-rewards-kit/tree/main/docs
topics:
  - referral
  - supabase
  - revenuecat
  - growth
  - invite

screenshots:
  - description: "InviteHub: the user's own code with Share and Copy, the live reward rules, and the friend's gift with its real deadline."
    path: screenshots/02-invite-hub.png
  - description: "Code entry: a friend types or pastes an invite code; the steps show how the gift is earned."
    path: screenshots/04-enter-code.png
  - description: "Almost yours: the code is added, the progress bar shows the one step left before the gift lands."
    path: screenshots/06-almost-yours.png
  - description: "Reward cards on the app's home screen once a reward is granted, shown once per device."
    path: screenshots/07-reward-cards.png
  - description: "The same invite hub in dark mode; every widget takes the app's own theme."
    path: screenshots/03-invite-hub-dark.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  intl: ">=0.19.0 <0.21.0"
  play_install_referrer: ">=0.5.0 <0.7.0"
  qr_flutter: ^4.1.0
  share_plus: ">=11.0.0 <14.0.0"
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  plugin:
    platforms:
      android:
        package: dev.referralkit.referral_kit
        pluginClass: ReferralKitPlugin
      ios:
        pluginClass: ReferralKitPlugin
      macos:
        dartPluginClass: ReferralKitDesktop
        dartFileName: src/desktop_plugin.dart
      windows:
        dartPluginClass: ReferralKitDesktop
        dartFileName: src/desktop_plugin.dart
      linux:
        dartPluginClass: ReferralKitDesktop
        dartFileName: src/desktop_plugin.dart
