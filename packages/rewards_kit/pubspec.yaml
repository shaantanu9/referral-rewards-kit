name: rewards_kit
description: >-
  Rewards for Flutter apps on Supabase: streaks, milestones, daily quizzes, quests, timed offers, leagues and
  follow-ups, granted exactly once by the server, with themeable widgets.
version: 0.8.1
# Not on pub.dev for now (pub.dev has 0.7.0): use it as a git dependency on this repository (tag rewards_kit-v0.8.1).
publish_to: none
homepage: https://www.myind.ai/referral-kit
repository: https://github.com/shaantanu9/referral-rewards-kit
issue_tracker: https://github.com/shaantanu9/referral-rewards-kit/issues
documentation: https://github.com/shaantanu9/referral-rewards-kit/tree/main/docs
topics:
  - gamification
  - rewards
  - supabase
  - streaks
  - engagement

screenshots:
  - description: "Rewards hub: surprise odds, a streak with freezes, a milestone, a timed offer with a server countdown and an Instagram tag reward."
    path: screenshots/01-hub.png
  - description: "The same widgets with the app's own look: every widget has a builder."
    path: screenshots/04-custom-look.png
  - description: "Daily quiz card, the daily goal ring and the activity heatmap."
    path: screenshots/05-quiz-and-goal.png
  - description: "Follow-up settings per group (reminders, comeback, recap, emails) and the notifications planned by the engine."
    path: screenshots/06-follow-ups.png
  - description: "Opt-in weekly league and the shareable year recap card."
    path: screenshots/07-league-and-recap.png
  - description: "The admin dashboard (web/rewards-admin): events, rewards given, streaks, offers and problems, with every program set up from the page."
    path: screenshots/08-admin-dashboard.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
