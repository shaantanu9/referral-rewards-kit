name: rewards_notifications_check
description: "Compile check of the rewards_kit FollowupNotifier adapter for flutter_local_notifications, with the device timezone from flutter_timezone passed to RewardsClient."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  rewards_kit:
    path: ../../packages/rewards_kit
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
