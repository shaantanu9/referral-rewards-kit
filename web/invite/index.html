<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Invite links must not be indexed or end up on coupon sites (ADR 8, 12). -->
  <meta name="robots" content="noindex, nofollow">
  <title>{{TITLE}}</title>
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #5d5d66; --bg: #fafafa; --card: #ffffff; --line: #d9d9e0; --accent: #2b59c3; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ececf1; --muted: #a7a7b3; --bg: #121214; --card: #1c1c20; --line: #34343c; --accent: #7aa2ff; --on-accent: #0b1020; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: var(--muted); }
    .code { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin: 0 0 24px; }
    .code[hidden] { display: none; }
    .code output { font: 600 1.75rem/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em; direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }
    button, .store { min-height: 48px; padding: 12px 18px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
    button { border: 1px solid var(--line); background: transparent; color: var(--fg); }
    .store { display: block; text-align: center; text-decoration: none; background: var(--accent); color: var(--on-accent); margin: 0 0 6px; }
    .note { font-size: .9rem; margin: 0 0 18px; }
    .disclosure { font-size: .95rem; margin: 0 0 12px; }
    .reward { color: var(--fg); font-weight: 600; margin: 0 0 8px; }
    .boost { color: var(--fg); margin: 0 0 16px; }
    [hidden] { display: none; }
    footer { margin-top: 24px; font-size: .9rem; }
    footer a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1 id="headline">{{HEADLINE}}</h1>
    <p id="disclosure" class="disclosure" {{DISCLOSURE_HIDDEN}}>{{DISCLOSURE}}</p>
    <p id="reward" class="reward" {{REWARD_HIDDEN}}>{{REWARD}}</p>
    <p id="boost" class="boost" {{BOOST_HIDDEN}}>{{BOOST}}</p>
    <p id="lead" data-lead-ok="{{LEAD_OK}}">{{LEAD}}</p>
    <div class="code" id="code-box" {{CODE_HIDDEN}}>
      <output id="code" data-code="{{CODE}}" aria-label="{{CODE_SPOKEN}}">{{CODE_DISPLAY}}</output>
      <button type="button" id="copy" data-copied="{{COPIED}}">{{COPY}}</button>
    </div>
    <a class="store" id="ios" href="{{APP_STORE_URL}}">{{APP_STORE}}</a>
    <p class="note">{{APP_STORE_NOTE}}</p>
    <a class="store" id="android" href="{{PLAY_URL}}">{{GOOGLE_PLAY}}</a>
    <p class="note">{{PLAY_NOTE}}</p>
    <p id="status" role="status" aria-live="polite"></p>
    <footer><a href="{{TERMS_URL}}">{{TERMS}}</a></footer>
  </main>
  <script type="application/json" id="preview-data">{{PREVIEW_DATA}}</script>
  <script>
    // Works without this script (server-rendered code). On a static host the code comes from the path /i/<CODE>.
    // No analytics, no storage. The only request is the optional invite preview to the app's own Supabase project, made
    // when the page was rendered for a static host with supabaseUrl + anonKey (README). It fills text with textContent.
    (function () {
      var out = document.getElementById("code");
      var code = out.getAttribute("data-code");
      if (!code || code.indexOf("{{") === 0) {
        var m = location.pathname.match(/\/i\/([A-Za-z0-9-]{8,9})\/?$/);
        var c = m ? m[1].replace(/-/g, "").toUpperCase() : "";
        if (/^[ABCDEFGHJKMNPQRSTUVWXYZ2-9]{8}$/.test(c)) {
          code = c;
          out.textContent = c.slice(0, 4) + "-" + c.slice(4);
          out.setAttribute("data-code", c);
          out.setAttribute("aria-label", c.split("").join(" "));
          document.getElementById("code-box").hidden = false;
          // Rendered without a code (static host), the lead says the link is not complete: now it is.
          var lead = document.getElementById("lead");
          if (lead.getAttribute("data-lead-ok")) lead.textContent = lead.getAttribute("data-lead-ok");
          var a = document.getElementById("android");
          a.href = a.href.split("&referrer=")[0] + "&referrer=" + encodeURIComponent("code=" + c);
        } else {
          code = "";
        }
      } else {
        out.setAttribute("aria-label", code.split("").join(" "));
      }
      var status = document.getElementById("status");
      function copy(done) {
        if (!code || !navigator.clipboard) { if (done) done(); return; }
        navigator.clipboard.writeText(code).then(function () {
          status.textContent = document.getElementById("copy").getAttribute("data-copied");
          if (done) done();
        }, function () { if (done) done(); });
      }
      document.getElementById("copy").addEventListener("click", function () { copy(); });
      preview(code);
      // iOS has no install referrer: copy the code in the same tap, then go to the App Store (ADR 4.2).
      document.getElementById("ios").addEventListener("click", function (e) {
        if (!code) return;
        e.preventDefault();
        var href = this.href;
        copy(function () { location.href = href; });
      });
    })();

    function preview(code) {
      var d;
      try { d = JSON.parse(document.getElementById("preview-data").textContent); } catch (e) { return; }
      if (!code || !d || !d.url || !d.key || !d.s || !window.fetch) return;
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 2000);
      var headers = { "content-type": "application/json", apikey: d.key };
      if (d.key.indexOf("eyJ") === 0) headers.authorization = "Bearer " + d.key;
      fetch(d.url, { method: "POST", headers: headers, body: JSON.stringify({ code: code }), signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (p) { clearTimeout(timer); if (p && p.valid === true) show(d, p); }, function () { clearTimeout(timer); });
    }

    // Same rules as render.ts: the name is cleaned and isolated, every value goes in as text, never as HTML.
    function show(d, p) {
      var s = d.s, loc = d.locale;
      var name = typeof p.name === "string"
        ? Array.from(p.name.normalize("NFC").replace(/[\t\n\v\f\r\u0085\u2028\u2029]/g, " ").replace(/[\u0000-\u001F\u007F-\u009F\u061C\u200E\u200F\u202A-\u202E\u2066-\u2069\u2028\u2029\uFEFF]/g, "").replace(/\s+/g, " ").trim()).slice(0, 40).join("").trim()
        : "";
      function fill(id, tpl, vars) {
        var el = document.getElementById(id);
        el.textContent = "";
        tpl.split(/(\{(?:name|app|reward|date|n)\})/).forEach(function (part) {
          var m = part.match(/^\{(name|app|reward|date|n)\}$/);
          if (m && m[1] === "name") {
            var b = document.createElement("bdi");
            b.textContent = vars.name;
            el.appendChild(b);
          } else {
            el.appendChild(document.createTextNode(m && vars[m[1]] !== undefined ? vars[m[1]] : part));
          }
        });
        el.hidden = false;
      }
      if (name) {
        fill("headline", s.invitedBy, { name: name, app: d.app });
        fill("lead", s.leadNamed, { app: d.app });
      }
      if (p.sharer_rewarded === true) {
        if (name) fill("disclosure", s.disclosure, { name: name, app: d.app });
        else fill("disclosure", s.disclosureAnon, { app: d.app });
      }
      var rewards = Array.isArray(p.friend_rewards) ? p.friend_rewards.filter(function (r) {
        return r && typeof r.kind === "string" && typeof r.amount === "number" && isFinite(r.amount) && r.amount > 0;
      }) : [];
      if (rewards.length) {
        var parts = [], plural = new Intl.PluralRules(loc), num = new Intl.NumberFormat(loc);
        for (var i = 0; i < rewards.length; i++) {
          var l = Object.prototype.hasOwnProperty.call(d.labels, rewards[i].kind) ? d.labels[rewards[i].kind] : null;
          if (!l) { parts = null; break; }
          parts.push((plural.select(rewards[i].amount) === "one" ? l.one : l.other).split("{n}").join(num.format(rewards[i].amount)));
        }
        if (parts) fill("reward", s.friendReward, { reward: Intl.ListFormat ? new Intl.ListFormat(loc, { type: "conjunction" }).format(parts) : parts.join(", "), app: d.app });
        else fill("reward", s.friendRewardNeutral, { app: d.app });
      }
      var b = p.boost, end = b && typeof b.ends_at === "string" ? Date.parse(b.ends_at) : NaN;
      if (b && end > Date.now() && typeof b.multiplier === "number" && b.multiplier > 1 && b.multiplier <= 5) {
        // Shown in the viewer's own time zone; the last day the boost runs (ends_at is exclusive). Never a countdown.
        var f = new Intl.DateTimeFormat(loc, { weekday: "short", day: "numeric", month: "short" }), last = new Date(end - 1);
        var date = f.format(last);
        if (d.lang === "en" && f.formatToParts) {
          var pt = {};
          f.formatToParts(last).forEach(function (x) { pt[x.type] = x.value; });
          date = pt.weekday + ", " + pt.day + " " + pt.month;
        }
        if (b.multiplier === 2) fill("boost", s.boostDouble, { date: date });
        else fill("boost", s.boostTimes, { date: date, n: new Intl.NumberFormat(loc).format(b.multiplier) });
      }
    }
  </script>
</body>
</html>
