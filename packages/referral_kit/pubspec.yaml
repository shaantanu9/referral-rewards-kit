name: referral_kit
description: >-
  Invite-friends screens, invite-code entry and a typed client for the referral-kit Supabase RPCs:
  install id that survives reinstall, offline claim queue, prompt policy and copy built from the live rules.
version: 0.3.0
repository: https://github.com/shaantanu9/referral-rewards-kit
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  intl: ">=0.19.0 <0.21.0"
  play_install_referrer: ">=0.5.0 <0.7.0"
  share_plus: ">=11.0.0 <14.0.0"
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  plugin:
    platforms:
      android:
        package: dev.referralkit.referral_kit
        pluginClass: ReferralKitPlugin
      ios:
        pluginClass: ReferralKitPlugin
